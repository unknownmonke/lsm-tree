plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.5.0'
    id 'com.bakdata.mockito' version '2.2.1' // Configures Mockito Java Agent for Java 21+.
}

group = 'org.monke.lsm'
description = 'Custom LSM-Tree implementation.'
version = '0.1.0'

wrapper {
    gradleVersion = '9.2'
}

repositories {
    mavenCentral()
}

// ------- Versions ------- //

def slf4jVersion = '2.0.17'
def log4j2Version = '2.25.2'
def junitVersion = '6.0.0'
def assertjVersion = '3.27.7'
def mockitoVersion = '5.23.0'

// ------------------------ //

dependencies {
    // --------- Logging --------- //
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:$log4j2Version"

    // ------- Unit testing ------ //
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
}

test {
    useJUnitPlatform()
}